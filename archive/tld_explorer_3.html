<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>semantic explorer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap');

:root {
  --bg-primary: #fcfcfa;
  --bg-secondary: #f5f5f2;
  --bg-muted: #efefeb;
  --line: #e5e5df;
  --text-primary: #151515;
  --text-secondary: #7d7d78;
  --text-tertiary: #b0ada6;
  --accent-plum: #8f84b8;
  --accent-lilac: #b9b0d2;
  --accent-sage: #aab7a8;
  --accent-bluegrey: #9eacbc;
  --accent-stone: #c8c5be;
  --accent-dust: #d8d2dd;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
}

#top {
  padding: 16px 24px 12px;
  display: flex;
  gap: 16px;
  align-items: baseline;
  flex-shrink: 0;
  z-index: 20;
  border-bottom: 1px solid var(--line);
}

#search {
  flex: 1;
  padding: 0 0 4px;
  font-size: 22px;
  font-weight: 300;
  letter-spacing: -0.02em;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--line);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.3s;
}
#search:focus { border-bottom-color: var(--accent-plum); }
#search::placeholder { color: var(--text-tertiary); font-weight: 300; }

.tb {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.04em;
  padding: 0;
  background: none;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  text-transform: lowercase;
  transition: color 0.15s;
  position: relative;
}
.tb:hover { color: var(--text-secondary); }
.tb.on { color: var(--text-primary); }
.tb.on::after {
  content: '';
  position: absolute;
  bottom: -3px;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--text-primary);
}

.tb-sep { color: var(--line); font-size: 10px; }

#status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-tertiary);
  min-width: 60px;
  text-align: right;
  letter-spacing: 0.02em;
}

/* ── Sets panel ── */
#sets-panel {
  display: none;
  padding: 10px 24px;
  gap: 24px;
  flex-shrink: 0;
  z-index: 20;
  border-bottom: 1px solid var(--line);
  align-items: flex-start;
}
#sets-panel.on { display: flex; }

.set-box { flex: 1; min-width: 0; }

.set-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  text-transform: lowercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-secondary);
}

.set-mark {
  width: 12px;
  height: 1.5px;
  display: inline-block;
}

.set-input {
  width: 100%;
  padding: 6px 0;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--line);
  color: var(--text-primary);
  outline: none;
  resize: none;
}
.set-input:focus { border-bottom-color: var(--accent-plum); }
.set-input::placeholder { color: var(--text-tertiary); }

.set-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-tertiary);
  margin-top: 4px;
}

/* ── Trail ── */
#trail {
  padding: 6px 24px 0;
  display: flex;
  gap: 4px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  min-height: 16px;
  flex-shrink: 0;
  z-index: 20;
}
.crumb { color: var(--text-tertiary); cursor: pointer; padding: 1px 3px; transition: color 0.15s; }
.crumb:hover { color: var(--text-primary); }
.crumb-sep { color: var(--line); font-size: 9px; }
.crumb-now { color: var(--accent-plum); font-weight: 500; }

/* ── Main ── */
#main { flex: 1; position: relative; overflow: hidden; }

#hex-view { position: absolute; inset: 0; }
#hex-svg { width: 100%; height: 100%; cursor: grab; }
#hex-svg:active { cursor: grabbing; }
#hex-svg .hex { cursor: pointer; }
#hex-svg .hex:hover .hex-bg { filter: brightness(0.96); }

.hex-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.01em;
  text-anchor: middle;
  dominant-baseline: central;
  fill: #7d7d78;
  pointer-events: none;
}
.hex-label-hit { fill: #151515; font-weight: 500; }
.hex-label-center {
  fill: #151515;
  font-weight: 500;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  letter-spacing: -0.02em;
}

/* ── Columns ── */
#col-view { position: absolute; inset: 0; display: none; padding: 16px 24px 60px; gap: 24px; overflow-y: auto; }
#col-view.on { display: flex; }
.col { flex: 1; min-width: 0; }
.col-hdr {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  text-transform: lowercase;
  letter-spacing: 0.1em;
  color: var(--text-tertiary);
  padding: 0 0 6px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 0;
}
.col-item {
  padding: 6px 0 6px 10px;
  border-bottom: 1px solid var(--bg-muted);
  cursor: pointer;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: color 0.12s;
  border-left: 2px solid transparent;
  background: none;
}
.col-item:hover { color: var(--accent-plum); }
.col-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-tertiary);
  letter-spacing: 0.02em;
}

/* ── Bottom ── */
#bottom {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; flex-direction: column; align-items: center;
  padding-bottom: 14px; pointer-events: none; z-index: 15;
}
#legend {
  display: none; align-items: center; gap: 14px;
  font-size: 9px; font-family: 'JetBrains Mono', monospace;
  color: var(--text-tertiary); margin-bottom: 8px; letter-spacing: 0.04em;
}
#legend.on { display: flex; }
.leg-mark { width: 10px; height: 1.5px; display: inline-block; vertical-align: middle; margin-right: 4px; }

#escapes { display: none; gap: 0; pointer-events: auto; border: 1px solid var(--line); }
#escapes.on { display: flex; }
.esc {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 6px 14px;
  background: none;
  border: none;
  border-right: 1px solid var(--line);
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all 0.12s;
  letter-spacing: 0.02em;
  text-transform: lowercase;
}
.esc:last-child { border-right: none; }
.esc:hover { color: var(--text-primary); }
.esc.on { color: var(--text-primary); background: var(--bg-muted); }

/* ── Figure label ── */
#fig-label {
  position: absolute; bottom: 58px; left: 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--text-tertiary);
  letter-spacing: 0.04em; display: none; z-index: 10;
}
#fig-label.on { display: block; }

#loading {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: var(--text-tertiary); font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  display: none; z-index: 5; letter-spacing: 0.04em;
}
#loading.on { display: block; }
.spin { display: inline-block; animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

#intro {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  text-align: center; color: var(--text-tertiary);
  font-size: 18px; font-weight: 300; line-height: 2.6;
  pointer-events: none; letter-spacing: -0.01em;
}
#intro span {
  display: block; font-size: 10px; color: var(--text-tertiary);
  font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em;
  margin-top: 4px;
}

#zoom-hint {
  position: absolute; top: 8px; right: 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--text-tertiary);
  z-index: 10; display: none; letter-spacing: 0.04em;
}
#zoom-hint.on { display: block; }
</style>
</head>
<body>

<div id="top">
  <input type="text" id="search" placeholder="type a word" autofocus>
  <button class="tb on" id="btn-hex" onclick="setView('hex')">hex</button>
  <span class="tb-sep">/</span>
  <button class="tb" id="btn-col" onclick="setView('col')">col</button>
  <span class="tb-sep">/</span>
  <button class="tb" id="btn-sets" onclick="toggleSets()">sets</button>
  <div id="status">[sys] loading</div>
</div>

<div id="sets-panel">
  <div class="set-box">
    <div class="set-label"><span class="set-mark" style="background:var(--accent-sage)"></span> tlds</div>
    <div class="set-count" id="tld-count"></div>
  </div>
  <div class="set-box">
    <div class="set-label"><span class="set-mark" style="background:var(--accent-plum)"></span> custom set</div>
    <textarea class="set-input" id="custom-input" rows="2" placeholder="comma-separated words, e.g. rabbit, hole, tangent, curiosity"></textarea>
    <div class="set-count" id="custom-count">0 words</div>
  </div>
</div>

<div id="trail"></div>

<div id="main">
  <div id="hex-view"><svg id="hex-svg"></svg></div>
  <div id="col-view"></div>
  <div id="loading"><span class="spin">&#9684;</span> exploring</div>
  <div id="intro">type anything to begin<br><span>click words to wander · toggle sets to add anchors</span></div>
  <div id="zoom-hint">scroll to zoom · drag to pan · double-click to reset</div>
  <div id="fig-label"></div>
  <div id="bottom">
    <div id="legend">
      <span><span class="leg-mark" style="background:var(--accent-sage)"></span> tld</span>
      <span><span class="leg-mark" style="background:var(--accent-plum)"></span> custom</span>
      <span><span class="leg-mark" style="background:linear-gradient(90deg,var(--accent-sage) 50%,var(--accent-plum) 50%)"></span> both</span>
    </div>
    <div id="escapes">
      <button class="esc on" data-m="ml">similar</button>
      <button class="esc" data-m="rel_trg">tangent</button>
      <button class="esc" data-m="rel_ant">flip</button>
      <button class="esc" data-m="rel_gen">zoom out</button>
      <button class="esc" data-m="rel_spc">zoom in</button>
    </div>
  </div>
</div>

// ── Explore ──
async function explore(word, mode, isEscape) {
  word = word.toLowerCase().trim();
  if (!isEscape && word === currentWord && mode === currentMode) return;

  document.getElementById('intro').style.display = 'none';
  document.getElementById('loading').classList.add('on');

  const gen = ++exploreGen;

  const q = encodeURIComponent(word);
  const url = mode === 'ml'
    ? `https://api.datamuse.com/words?ml=${q}&max=30`
    : `https://api.datamuse.com/words?${mode}=${q}&max=30`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (gen !== exploreGen) return;

    if (!data.length) {
      document.getElementById('loading').classList.remove('on');
      document.getElementById('status').textContent = '[sys] no results';
      return;
    }

    const maxScore = Math.max(...data.map(r => r.score || 1));

    let nodes = data.map(r => {
      const w = r.word.toLowerCase();
      const wc = w.replace(/\s/g, '');
      const similarity = (r.score || 1) / maxScore;

      const isTld = tldSet.has(wc);
      let tldWarmth = 0, nearbyTlds = [];
      if (isTld) { tldWarmth = 1; }
      else if (tldWeb && tldWeb[w]) {
        nearbyTlds = tldWeb[w].slice(0, 3);
        tldWarmth = nearbyTlds.reduce((s, t) => s + t.score, 0) / 3;
      }

      const isCustom = customSet.has(wc) || customSet.has(w);
      const customWarmth = isCustom ? 1 : 0;

      return { word: w, similarity, tldWarmth, customWarmth, isTld, isCustom, nearbyTlds };
    });

    const seen = new Set();
    nodes = nodes.filter(n => {
      if (seen.has(n.word) || n.word === word) return false;
      seen.add(n.word);
      return true;
    }).slice(0, 24);

    if (!isEscape && currentWord && currentWord !== word) {
      history.push(currentWord);
      if (history.length > 15) history.shift();
    }
    currentWord = word;
    currentNodes = nodes;

    render(word, nodes);
    renderTrail();
    searchEl.value = word;
    document.getElementById('escapes').classList.add('on');
    document.getElementById('legend').classList.add('on');
    document.getElementById('zoom-hint').classList.toggle('on', currentView === 'hex');
    document.getElementById('fig-label').classList.toggle('on', currentView === 'hex');
    updateFigLabel(word, mode);

    if (!isEscape) {
      document.querySelectorAll('.esc').forEach(b => b.classList.remove('on'));
      document.querySelector('.esc').classList.add('on');
    }

    const tc = nodes.filter(n => n.isTld).length;
    const cc = nodes.filter(n => n.isCustom).length;
    let st = '[sys] ' + nodes.length + ' words';
    if (tc) st += ' · ' + tc + ' tlds';
    if (cc) st += ' · ' + cc + ' custom';
    document.getElementById('status').textContent = st;

  } catch (err) {
    if (gen !== exploreGen) return;
    console.error(err);
    document.getElementById('status').textContent = '[sys] api error';
  }
  document.getElementById('loading').classList.remove('on');
}

// ── Colours ──
const COL_TLD = '#aab7a8';       // sage
const COL_TLD_FILL = '#e8ede9';   // pale sage
const COL_CUSTOM = '#8f84b8';     // plum
const COL_CUSTOM_FILL = '#e8e4f2'; // pale plum
const COL_NEUTRAL = '#f5f5f2';
const COL_CENTER = '#eceef2';
const COL_CENTER_STROKE = '#9eacbc';
const COL_LINE = '#e5e5df';

function warmthColorTld(w) {
  const c = [245,245,242], h = [215,228,218];
  return `rgb(${c.map((v,i) => Math.round(v + (h[i]-v)*w)).join(',')})`;
}

function warmthColorCustom(w) {
  const c = [245,245,242], h = [225,218,238];
  return `rgb(${c.map((v,i) => Math.round(v + (h[i]-v)*w)).join(',')})`;
}

// ══════════════════
// HEX VIEW
// ══════════════════
let vb = { x: -400, y: -300, w: 800, h: 600 };
let dragging = false, dragStart = null;

function renderHex(centerWord, nodes) {
  const svg = document.getElementById('hex-svg');

  const sorted = [...nodes].sort((a, b) => {
    const aHit = (a.isTld || a.isCustom) ? 1 : 0;
    const bHit = (b.isTld || b.isCustom) ? 1 : 0;
    if (aHit !== bHit) return bHit - aHit;
    return (b.tldWarmth + b.customWarmth) - (a.tldWarmth + a.customWarmth);
  });

  const centerIsTld = tldSet.has(centerWord.replace(/\s/g, ''));
  const centerIsCustom = customSet.has(centerWord.replace(/\s/g, '')) || customSet.has(centerWord);

  const all = [
    { word: centerWord, isCenter: true, isTld: centerIsTld, isCustom: centerIsCustom, tldWarmth: centerIsTld ? 1 : 0, customWarmth: centerIsCustom ? 1 : 0 },
    ...sorted
  ];

  const hexR = 42;
  const hexW = Math.sqrt(3) * hexR;
  const hexH = 2 * hexR;
  const positions = hexSpiral(all.length);

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

  const items = all.map((item, i) => {
    const [q, r] = positions[i];
    const px = hexW * (q + r * 0.5);
    const py = hexH * 0.75 * r;
    minX = Math.min(minX, px - hexR); minY = Math.min(minY, py - hexR);
    maxX = Math.max(maxX, px + hexR); maxY = Math.max(maxY, py + hexR);
    return { ...item, px, py };
  });

  const pad = 60;
  vb = { x: minX - pad, y: minY - pad, w: (maxX - minX) + pad * 2, h: (maxY - minY) + pad * 2 };

  const fullPts = hexPts(hexR);
  const leftPts = hexHalfPts(hexR, 'left');
  const rightPts = hexHalfPts(hexR, 'right');

  let s = '';
  items.forEach(item => {
    const hasTld = item.isTld || item.tldWarmth > 0.2;
    const hasCust = item.isCustom;
    const hasEither = hasTld || hasCust;
    const dataAttr = item.isCenter ? '' : `data-w="${escA(item.word)}"`;

    let hexContent;

    if (item.isCenter) {
      hexContent = `<polygon class="hex-bg" points="${fullPts}" fill="${COL_CENTER}" stroke="${COL_CENTER_STROKE}" stroke-width="1.5"/>`;
    } else if (hasTld && hasCust) {
      const lf = item.isTld ? COL_TLD_FILL : warmthColorTld(item.tldWarmth);
      hexContent = `<polygon class="hex-bg" points="${leftPts}" fill="${lf}" stroke="${COL_TLD}" stroke-width="1"/>` +
                   `<polygon class="hex-bg" points="${rightPts}" fill="${COL_CUSTOM_FILL}" stroke="${COL_CUSTOM}" stroke-width="1"/>`;
    } else if (hasTld) {
      const f = item.isTld ? COL_TLD_FILL : warmthColorTld(item.tldWarmth);
      const sw = item.isTld ? 1.5 : 0.5;
      const sc = item.isTld ? COL_TLD : COL_LINE;
      hexContent = `<polygon class="hex-bg" points="${fullPts}" fill="${f}" stroke="${sc}" stroke-width="${sw}"/>`;
    } else if (hasCust) {
      hexContent = `<polygon class="hex-bg" points="${fullPts}" fill="${COL_CUSTOM_FILL}" stroke="${COL_CUSTOM}" stroke-width="1.5"/>`;
    } else {
      hexContent = `<polygon class="hex-bg" points="${fullPts}" fill="${COL_NEUTRAL}" stroke="${COL_LINE}" stroke-width="0.5"/>`;
    }

    const display = (item.isTld && !item.isCenter) ? '.' + item.word.replace(/\s/g, '') : item.word;
    const trunc = display.length > 9 ? display.slice(0, 8) + '\u2026' : display;
    const labelCls = item.isCenter ? 'hex-label hex-label-center' : (hasEither ? 'hex-label hex-label-hit' : 'hex-label');

    s += `<g class="hex" transform="translate(${item.px},${item.py})" ${dataAttr}>${hexContent}<text class="${labelCls}" x="0" y="0">${escH(trunc)}</text></g>`;
  });

  svg.innerHTML = s;
  applyVB();
  svg.onclick = e => { const g = e.target.closest('g[data-w]'); if (g) hop(g.dataset.w); };
}

function escA(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escH(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function hexPts(r) {
  const p = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30);
    p.push(`${(Math.cos(a)*r).toFixed(1)},${(Math.sin(a)*r).toFixed(1)}`);
  }
  return p.join(' ');
}

function hexHalfPts(r, side) {
  const verts = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30);
    verts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  if (side === 'left') {
    return [verts[5], verts[4], verts[3], verts[2]].map(v => `${v[0].toFixed(1)},${v[1].toFixed(1)}`).join(' ');
  } else {
    return [verts[5], verts[0], verts[1], verts[2]].map(v => `${v[0].toFixed(1)},${v[1].toFixed(1)}`).join(' ');
  }
}

function hexSpiral(n) {
  const c = [[0,0]];
  const dirs = [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
  let ring = 1;
  while (c.length < n) {
    let q = 0, r = -ring;
    for (let d = 0; d < 6 && c.length < n; d++)
      for (let s = 0; s < ring && c.length < n; s++) {
        c.push([q, r]); q += dirs[d][0]; r += dirs[d][1];
      }
    ring++;
  }
  return c;
}

function applyVB() { document.getElementById('hex-svg').setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }

// ── Pan/Zoom ──
const MIN_VB_DIM = 100;
const MAX_VB_DIM = 8000;

const hexSvg = document.getElementById('hex-svg');
hexSvg.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY > 0 ? 1.12 : 0.89;
  const newW = vb.w * f, newH = vb.h * f;
  if (newW < MIN_VB_DIM || newH < MIN_VB_DIM || newW > MAX_VB_DIM || newH > MAX_VB_DIM) return;
  const rect = hexSvg.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width;
  const my = (e.clientY - rect.top) / rect.height;
  const px = vb.x + vb.w * mx, py = vb.y + vb.h * my;
  vb.w = newW; vb.h = newH;
  vb.x = px - vb.w * mx; vb.y = py - vb.h * my;
  applyVB();
}, { passive: false });

hexSvg.addEventListener('mousedown', e => {
  if (e.target.closest('g[data-w]')) return;
  dragging = true; dragStart = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y };
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const rect = hexSvg.getBoundingClientRect();
  const scale = vb.w / rect.width;
  vb.x = dragStart.vx - (e.clientX - dragStart.x) * scale;
  vb.y = dragStart.vy - (e.clientY - dragStart.y) * scale;
  applyVB();
});
window.addEventListener('mouseup', () => { dragging = false; });

let lastTouches = null;
hexSvg.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { dragging = true; dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, vx: vb.x, vy: vb.y }; }
  lastTouches = [...e.touches];
}, { passive: true });
hexSvg.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && dragging) {
    const rect = hexSvg.getBoundingClientRect();
    const sc = vb.w / rect.width;
    vb.x = dragStart.vx - (e.touches[0].clientX - dragStart.x) * sc;
    vb.y = dragStart.vy - (e.touches[0].clientY - dragStart.y) * sc;
    applyVB();
  } else if (e.touches.length === 2 && lastTouches && lastTouches.length === 2) {
    const pd = Math.hypot(lastTouches[0].clientX - lastTouches[1].clientX, lastTouches[0].clientY - lastTouches[1].clientY);
    const cd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const f = pd / cd;
    const newW = vb.w * f, newH = vb.h * f;
    if (newW >= MIN_VB_DIM && newH >= MIN_VB_DIM && newW <= MAX_VB_DIM && newH <= MAX_VB_DIM) {
      const cx = vb.x + vb.w/2, cy = vb.y + vb.h/2;
      vb.w = newW; vb.h = newH; vb.x = cx - vb.w/2; vb.y = cy - vb.h/2; applyVB();
    }
  }
  lastTouches = [...e.touches];
}, { passive: true });
hexSvg.addEventListener('touchend', () => { dragging = false; lastTouches = null; });
hexSvg.addEventListener('dblclick', e => {
  if (e.target.closest('g[data-w]')) return;
  if (currentWord && currentNodes.length) renderHex(currentWord, currentNodes);
});

// ══════════════════
// COLUMNS
// ══════════════════
function renderCols(centerWord, nodes) {
  const el = document.getElementById('col-view');
  const cold = [], warm = [], tlds = [], customs = [];

  nodes.forEach(n => {
    if (n.isTld) tlds.push(n);
    if (n.isCustom) customs.push(n);
    if (!n.isTld && !n.isCustom) {
      if (n.tldWarmth > 0.15) warm.push(n);
      else cold.push(n);
    }
  });

  const indirect = new Map();
  warm.forEach(n => {
    (n.nearbyTlds || []).forEach(t => {
      if (!indirect.has(t.tld)) indirect.set(t.tld, { tld: t.tld, score: t.score, via: n.word });
    });
  });
  const directSet = new Set(tlds.map(t => t.word.replace(/\s/g, '')));
  indirect.forEach((v, k) => {
    if (!directSet.has(k)) tlds.push({ word: k, isTld: true, tldWarmth: 1, similarity: v.score, via: v.via });
  });

  cold.sort((a,b) => b.similarity - a.similarity);
  warm.sort((a,b) => b.tldWarmth - a.tldWarmth);

  function item(n, type) {
    const isTld = n.isTld, isCust = n.isCustom;
    const borderClass = isTld ? 'col-item-tld' : (isCust ? 'col-item-custom' : (type === 'warm' ? 'col-item-warm' : ''));
    const display = isTld ? '.' + n.word.replace(/\s/g, '') : n.word;
    const meta = n.via ? `via ${n.via}` :
      (n.nearbyTlds && n.nearbyTlds.length ? n.nearbyTlds.length + ' tlds' : Math.round((n.similarity||0) * 100) + '%');
    return `<div class="col-item ${borderClass}" data-w="${escA(n.word)}">${escH(display)}<span class="col-meta">${meta}</span></div>`;
  }

  const hasCustom = customSet.size > 0;
  el.innerHTML = `
    <div class="col"><div class="col-hdr">cold</div>${cold.map(n => item(n, 'cold')).join('') || '<div class="col-meta" style="padding:8px 0">none</div>'}</div>
    <div class="col"><div class="col-hdr">warm</div>${warm.map(n => item(n, 'warm')).join('') || '<div class="col-meta" style="padding:8px 0">none</div>'}</div>
    <div class="col"><div class="col-hdr" style="color:var(--accent-sage)">tlds</div>${tlds.map(n => item(n, 'tld')).join('') || '<div class="col-meta" style="padding:8px 0">keep exploring</div>'}</div>
    ${hasCustom ? `<div class="col"><div class="col-hdr" style="color:var(--accent-plum)">custom set</div>${customs.map(n => item(n, 'custom')).join('') || '<div class="col-meta" style="padding:8px 0">keep exploring</div>'}</div>` : ''}
  `;
  el.onclick = e => { const it = e.target.closest('[data-w]'); if (it) hop(it.dataset.w); };
}

// ── Trail ──
function renderTrail() {
  const t = document.getElementById('trail');
  if (!history.length && !currentWord) { t.innerHTML = ''; return; }
  let h = history.map(w =>
    `<span class="crumb" data-w="${escA(w)}">${escH(w)}</span><span class="crumb-sep">\u2192</span>`
  ).join('');
  h += `<span class="crumb crumb-now">${escH(currentWord)}</span>`;
  t.innerHTML = h;
}

window.addEventListener('resize', () => {
  if (currentWord && currentNodes.length) render(currentWord, currentNodes);
});
</script>
